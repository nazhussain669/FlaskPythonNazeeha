<html>
<head>
    <title>Transaction Complete</title>
	<link rel="stylesheet" href="/static/onlinebanking_style.css"></link>
</head>

<body>

    <h1>Transaction Information</h1>

<h2>{{message}}</h2>

{% if message != "Incorrect PIN" and message != "Account Not Found" %}

<table>

    <tr>
        <th>DETAIL</th>
        <th>INFORMATION</th>
    </tr>

    <tr>
        <td>Account Number</td>
        <td>{{accnum}}</td>
    </tr>

    <tr>
        <td>Account Type</td>
        <td>{{accounttype}}</td>
    </tr>

    <tr>
        <td>Transaction Type</td>
        <td>{{transtype}}</td>
    </tr>

    <tr>
        <td>Amount</td>
        <td>${{amount}}</td>
    </tr>

    <tr>
        <td>Updated Balance</td>
        <td>${{balance}}</td>
    </tr>

</table>

{% endif %}

    <br>

    <a href="{{url_for('index')}}">
		<button>MAIN PAGE</button>
	</a>
	
	<br><br>
	
	<a href="{{url_for('index')}}">
		<button>LOGOUT</button>
	</a>

</body>
</html>
