<html>
<head>
    <title>Account Information</title>
</head>

<body>

    <h1>Bank Account Successfully Created</h1>

    <h3>{{personalfile}} and {{bankingfile}} have been created.</h3>

    <table border="1">

        <tr>
            <th>ACCOUNT INFORMATION</th>
            <th>DETAILS</th>
        </tr>

        <tr>
            <td>Full Name</td>
            <td>{{fullname}}</td>
        </tr>

        <tr>
            <td>Age</td>
            <td>{{age}}</td>
        </tr>

        <tr>
            <td>Email</td>
            <td>{{email}}</td>
        </tr>

        <tr>
            <td>Account Number</td>
            <td>{{accountnum}}</td>
        </tr>

        <tr>
            <td>Account Type</td>
            <td>{{accounttype}}</td>
        </tr>

        <tr>
            <td>Balance</td>
            <td>${{balance}}</td>
        </tr>

        <tr>
            <td>Username</td>
            <td>{{username}}</td>
        </tr>

    </table>

    <br>

    <a href="{{url_for('index')}}">
        <button>MAIN PAGE</button>
    </a>

</body>
</html>
