<html>
<head>
    <title>STUDENT INFO</title>
    <link rel="stylesheet" type="text/css" href="static/style_student_info.css">
</head>
<body>
	<h1>Add New Student</h1>
	<h2>General Information</h2>
	
	<form action="{{url_for('CollectInfo')}}">
	
        <label>First Name:</label>
        <input type="text" id="fname" name="fname" autofocus required><br><br>
		
		<label id="lblmidinit" name="lblmidinit">Middle Initial</label>
		<input type="text" id="minit" name="midinit" maxlength="1"></input><br><br>
		
		<label>Last Name:</label>
        <input type="text" id="lname" name="lname" required><br><br>
		
		<label>Birth Date:</label>
        <input type="date" id="bday" name="bday" required><br><br>
		
		<label>OSIS:</label>
        <input type="number" id="id" name="id" required><br><br>

        <label>School:</label>
        <select name="school">
            {% for school in schools %}
                <option>{{school}}</option>
            {% endfor %}
        </select><br><br>
		
		<label>Program Type:</label>
        <select name="program">
            {% for program in programs %}
                <option>{{program}}</option>
            {% endfor %}
        </select><br><br>
		
		<label>Pathway:</label>
        <select name="path">
            {% for path in paths %}
                <option>{{path}}</option>
            {% endfor %}
        </select><br><br>
		
		<button type="submit">SAVE</button>
		
		<a href="{{ url_for('index') }}">
			<button type="button">CANCEL</button>
		</a>
		
	</form>
</body>
</html>
