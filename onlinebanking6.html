<html>
<head>
    <title>Transaction</title>
	<link rel="stylesheet" href="/static/onlinebanking_style.css"></link>
</head>

<body>

    <h1>Login To Your Account</h1>

    <form action="{{url_for('MakeTransaction')}}">

        <label>Enter Account Number:</label>
        <input type="number" name="accnum" min="1000000" max="9999999" autofocus required><br><br>

        <label>Enter PIN:</label>
        <input type="number" name="pin" min="1000" max="9999" required><br><br>

        <label>Account Type:</label>
        <select name="accounttype" required>
            <option>Checking</option>
            <option>Savings</option>
        </select><br><br>

        <label>Transaction Type:</label>
        <select name="transtype" required>
            <option>DEPOSIT</option>
            <option>WITHDRAWAL</option>
        </select><br><br>

        <label>Amount($20+):</label>
        <input type="number" name="amount" min="20" required><br><br>

        <button type="submit">SEND</button>

        <a href="{{url_for('index')}}">
            <button type="button">MAIN PAGE</button>
        </a>

    </form>

</body>
</html>
