<html>
<head>
    <title>Transaction</title>
	<link rel="stylesheet" href="/static/onlinebanking_style.css"></link>
</head>

<body>

    <h1>Complete a Transaction</h1>

    <form action="{{url_for('MakeTransaction')}}">

        <label>Enter Account Number:</label>
        <input type="number" name="accnum" autofocus required><br><br>
		
		<label>Transaction Type:</label>
        <select name="transtype" required>
            <option>DEPOSIT</option>
            <option>WITHDRAWAL</option>
        </select><br><br>
		
		<label>Amount:</label>
		<input type="number" name="amount">

        <button type="submit">SEND</button>

        <a href="{{url_for('index')}}">
            <button type="button">MAIN PAGE</button>
        </a>

    </form>

</body>
</html>
