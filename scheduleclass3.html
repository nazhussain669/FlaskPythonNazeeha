<html>
<head>
    <title>Student Schedule Table</title>
</head>
<body>

    <h1>Student Schedule</h1>

    <table border="1">
        <tr>
            <th>PERIOD</th>
            <th>MONDAY</th>
            <th>TUESDAY</th>
            <th>WEDNESDAY</th>
            <th>THURSDAY</th>
            <th>FRIDAY</th>
        </tr>

        {% for sched in schedule %}
        <tr>
            <td>{{ sched.period }}</td>
            <td>{{ sched.course }}</td>
            <td>{{ sched.course }}</td>
            <td>{{ sched.course }}</td>
            <td>{{ sched.course }}</td>
            <td>{{ sched.course }}</td>
        </tr>
        {% endfor %}

        <tr>
            <td>
                <a href="{{url_for('index')}}">
                    <button>Go Back</button>
                </a>
            </td>
        </tr>
    </table>

</body>
</html>
